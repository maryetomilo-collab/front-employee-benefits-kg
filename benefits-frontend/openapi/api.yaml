openapi: 3.0.3

info:
  title: Employee Benefits API
  version: 0.1.0

servers:
  - url: http://localhost:8080

tags:
  - name: Partner Registration
    description: Регистрация партнёра и управление черновиком регистрации
  - name: Partners
    description: Получение данных партнёров

paths:
  /api/partners/{partnerId}:
    get:
      tags:
        - Partners
      summary: Получить данные партнёра
      operationId: getPartner
      parameters:
        - name: partnerId
          in: path
          required: true
          description: ID партнёра
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные партнёра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
              example:
                id: "3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123"
                name: Макаронная
                branches:
                  - id: "7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11"
                    name: Советская
                    address: Советская, 345
                  - id: "2d9c9134-f86d-46c4-b35c-a467638ab211"
                    name: Токтогула
                    address: Токтогула, 125
                offers:
                  - id: "1b4f02e8-a111-4c2a-9d5c-4e4d97cc2c96"
                    name: Скидка 10%
                    activationDate: "2026-08-06"
                  - id: "6a84f2b1-3907-47e4-9022-49d319114e88"
                    name: Бесплатный напиток к заказу
                    activationDate: "2026-08-10"
        '404':
          description: Партнёр не найден

  /api/partner-registration/draft/business-info:
    put:
      tags:
        - Partner Registration
      summary: Save partner registration draft business info
      operationId: savePartnerRegistrationDraftBusinessInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePartnerRegistrationDraftBusinessInfoRequest'
      responses:
        '200':
          description: Partner registration draft business info saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"

  /api/partner-registration/draft/contact-info:
    put:
      tags:
        - Partner Registration
      summary: Save partner registration draft contact info
      operationId: savePartnerRegistrationDraftContactInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePartnerRegistrationDraftContactInfoRequest'
      responses:
        '200':
          description: Partner registration draft contact info saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"

  /api/partner-registration/drafts/{draftId}:
    get:
      tags:
        - Partner Registration
      summary: Get partner registration draft
      operationId: getPartnerRegistrationDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partner registration draft found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPartnerRegistrationDraftResponse'
              example:
                draftId: "7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11"
                status: DRAFT
                completedSteps:
                  - BUSINESS_INFO
                  - CONTACTS
                businessInfo:
                  businessName: Sierra Coffee
                  description: Кофейня в центре Бишкека
                  category: COFFEE_SHOP
                contacts:
                  contactName: Азамат
                  contactPhone: "+996700123456"
                  contactEmail: partner@example.kg
  /api/partner-registration/drafts/{draftId}/submit:
    post:
      tags:
        - Partner Registration Drafts
      summary: Завершить регистрацию партнёра
      description: >
        Завершает черновик регистрации партнёра.
        После успешного завершения статус черновика меняется с DRAFT на SUBMITTED.
        Для MVP система создаёт партнёра в статусе PENDING.
      operationId: submitPartnerRegistrationDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID черновика регистрации партнёра
      responses:
        '200':
          description: Регистрация партнёра завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"
                status: SUBMITTED
                partnerId: "3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123"  

components:
  schemas:
    PartnerResponse:
      type: object
      required:
        - id
        - name
        - branches
        - offers
      properties:
        id:
          type: string
          format: uuid
          example: 3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123

        name:
          type: string
          example: Макаронная

        branches:
          type: array
          items:
            $ref: '#/components/schemas/PartnerBranch'

        offers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOffer'

    PartnerBranch:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
          format: uuid
          example: 7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11

        name:
          type: string
          example: Советская

        address:
          type: string
          example: Советская, 345

    PartnerOffer:
      type: object
      required:
        - id
        - name
        - activationDate
      properties:
        id:
          type: string
          format: uuid
          example: 1b4f02e8-a111-4c2a-9d5c-4e4d97cc2c96

        name:
          type: string
          example: Скидка 10%

        activationDate:
          type: string
          format: date
          example: 2026-08-06

    SavePartnerRegistrationDraftBusinessInfoRequest:
      type: object
      required:
        - businessName
        - category
      properties:
        draftId:
          type: string
          format: uuid
          nullable: true
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        businessName:
          type: string
          minLength: 2
          maxLength: 100
          example: Sierra Coffee

        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Кофейня с завтраками, десертами и напитками

        category:
          $ref: '#/components/schemas/PartnerCategory'

    SavePartnerRegistrationDraftContactInfoRequest:
      type: object
      required:
        - contactName
        - contactPhone
      properties:
        draftId:
          type: string
          format: uuid
          nullable: true
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        contactName:
          type: string
          minLength: 2
          maxLength: 100
          example: Азамат

        contactPhone:
          type: string
          example: "+996700123456"

        contactEmail:
          type: string
          format: email
          maxLength: 255
          nullable: true
          example: azamat@mail.com

    PartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
      properties:
        draftId:
          type: string
          format: uuid
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

    PartnerCategory:
      type: string
      enum:
        - COFFEE_SHOP
        - RESTAURANT
        - FITNESS
        - BEAUTY
        - EDUCATION
        - HEALTH
        - ENTERTAINMENT
        - OTHER

    GetPartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
        - status
        - completedSteps
      properties:
        draftId:
          type: string
          format: uuid
          example: 7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11

        status:
          type: string
          example: DRAFT

        completedSteps:
          type: array
          items:
            $ref: '#/components/schemas/PartnerRegistrationStep'
          example:
            - BUSINESS_INFO
            - CONTACTS

        businessInfo:
          $ref: '#/components/schemas/PartnerRegistrationDraftBusinessInfo'

        contacts:
          $ref: '#/components/schemas/PartnerRegistrationDraftContacts'

    PartnerRegistrationDraftBusinessInfo:
      type: object
      properties:
        businessName:
          type: string
          example: Sierra Coffee

        description:
          type: string
          nullable: true
          example: Кофейня в центре Бишкека

        category:
          $ref: '#/components/schemas/PartnerCategory'

    PartnerRegistrationDraftContacts:
      type: object
      properties:
        contactName:
          type: string
          example: Азамат

        contactPhone:
          type: string
          example: "+996700123456"

        contactEmail:
          type: string
          format: email
          nullable: true
          example: partner@example.kg

    PartnerRegistrationStep:
      type: string
      enum:
        - BUSINESS_INFO
        - CONTACTS
        
    SubmitPartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
        - status
        - partnerId
      properties:
        draftId:
          type: string
          format: uuid
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        status:
          type: string
          example: SUBMITTED

        partnerId:
          type: string
          format: uuid
          example: 3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123
