openapi: 3.0.3

info:
  title: Employee Benefits API
  version: 0.1.0

servers:
  - url: http://localhost:8080

tags:
  - name: Partner Registration
    description: Регистрация партнёра и управление черновиком регистрации
  - name: Partners
    description: Получение данных партнёров
  - name: Partner Offers
    description: Управление офферами текущего партнёра

paths:
  /api/partners/{partnerId}:
    get:
      tags:
        - Partners
      summary: Получить данные партнёра
      operationId: getPartner
      parameters:
        - name: partnerId
          in: path
          required: true
          description: ID партнёра
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные партнёра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
              example:
                id: "3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123"
                name: Макаронная
                statistics:
                  activeOffers: 8
                  totalOffers: 12
                  availableCodes: 1256
                  totalCodes: 2300
                  usedCodes: 1044
                  locationsCount: 5
                  citiesCount: 2
                branches:
                  - id: "7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11"
                    name: Советская
                    address: Советская, 345
                  - id: "2d9c9134-f86d-46c4-b35c-a467638ab211"
                    name: Токтогула
                    address: Токтогула, 125
                offers:
                  - id: "1b4f02e8-a111-4c2a-9d5c-4e4d97cc2c96"
                    name: Скидка 10%
                    status: ACTIVE
                    activationDate: "2026-08-06"
                    expirationDate: "2026-09-06"
                    availableCodes: 320
                    usedCodes: 210
                    usagePercent: 66
                  - id: "6a84f2b1-3907-47e4-9022-49d319114e88"
                    name: Бесплатный напиток к заказу
                    status: ACTIVE
                    activationDate: "2026-08-10"
                    expirationDate: "2026-09-10"
                    availableCodes: 150
                    usedCodes: 98
                    usagePercent: 65
        '404':
          description: Партнёр не найден

  /api/partner/offers:
    get:
      tags:
        - Partner Offers
      summary: Получить офферы текущего партнёра
      description: Получить все офферы, принадлежащие текущему авторизованному партнёру
      operationId: getPartnerOffers
      responses:
        '200':
          description: Список офферов текущего партнёра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOffersResponse'
              examples:
                offers:
                  summary: Офферы найдены
                  value:
                    offers:
                      - id: "c148461f-2364-47a4-9951-afc89efdf199"
                        title: Скидка 20% на кофе
                        status: ACTIVE
                        validFrom: "2026-08-01"
                        validTo: "2026-08-31"
                        availableCodes: 74
                        totalCodes: 100
                empty:
                  summary: Офферов нет
                  value:
                    offers: []

  /api/partner-registration/draft/business-info:
    put:
      tags:
        - Partner Registration
      summary: Save partner registration draft business info
      operationId: savePartnerRegistrationDraftBusinessInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePartnerRegistrationDraftBusinessInfoRequest'
      responses:
        '200':
          description: Partner registration draft business info saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"

  /api/partner-registration/draft/contact-info:
    put:
      tags:
        - Partner Registration
      summary: Save partner registration draft contact info
      operationId: savePartnerRegistrationDraftContactInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePartnerRegistrationDraftContactInfoRequest'
      responses:
        '200':
          description: Partner registration draft contact info saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"

  /api/partner-registration/drafts/{draftId}:
    get:
      tags:
        - Partner Registration
      summary: Get partner registration draft
      operationId: getPartnerRegistrationDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partner registration draft found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPartnerRegistrationDraftResponse'
              example:
                draftId: "7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11"
                status: DRAFT
                completedSteps:
                  - BUSINESS_INFO
                  - CONTACTS
                businessInfo:
                  businessName: Sierra Coffee
                  description: Кофейня в центре Бишкека
                  category: COFFEE_SHOP
                contacts:
                  contactName: Азамат
                  contactPhone: "+996700123456"
                  contactEmail: partner@example.kg
  /api/partner-registration/drafts/{draftId}/submit:
    post:
      tags:
        - Partner Registration Drafts
      summary: Завершить регистрацию партнёра
      description: >
        Завершает черновик регистрации партнёра.
        После успешного завершения статус черновика меняется с DRAFT на SUBMITTED.
        Для MVP система создаёт партнёра в статусе PENDING.
      operationId: submitPartnerRegistrationDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID черновика регистрации партнёра
      responses:
        '200':
          description: Регистрация партнёра завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPartnerRegistrationDraftResponse'
              example:
                draftId: "b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111"
                status: SUBMITTED
                partnerId: "3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123"  

components:
  schemas:
    PartnerResponse:
      type: object
      required:
        - id
        - name
        - statistics
        - branches
        - offers
      properties:
        id:
          type: string
          format: uuid
          example: 3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123

        name:
          type: string
          example: Макаронная

        statistics:
          $ref: '#/components/schemas/PartnerStatistics'

        branches:
          type: array
          items:
            $ref: '#/components/schemas/PartnerBranch'

        offers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOffer'

    PartnerStatistics:
      type: object
      required:
        - activeOffers
        - totalOffers
        - availableCodes
        - totalCodes
        - usedCodes
        - locationsCount
        - citiesCount
      properties:
        activeOffers:
          type: integer
          minimum: 0
          description: Количество активных офферов
          example: 8

        totalOffers:
          type: integer
          minimum: 0
          description: Общее количество офферов
          example: 12

        availableCodes:
          type: integer
          minimum: 0
          description: Количество доступных для использования кодов
          example: 1256

        totalCodes:
          type: integer
          minimum: 0
          description: Общее количество выпущенных кодов
          example: 2300

        usedCodes:
          type: integer
          minimum: 0
          description: Количество использованных кодов за всё время
          example: 1044

        locationsCount:
          type: integer
          minimum: 0
          description: Количество точек партнёра
          example: 5

        citiesCount:
          type: integer
          minimum: 0
          description: Количество городов присутствия партнёра
          example: 2

    PartnerBranch:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
          format: uuid
          example: 7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11

        name:
          type: string
          example: Советская

        address:
          type: string
          example: Советская, 345

    PartnerOffer:
      type: object
      required:
        - id
        - name
        - status
        - activationDate
        - expirationDate
        - availableCodes
        - usedCodes
        - usagePercent
      properties:
        id:
          type: string
          format: uuid
          example: 1b4f02e8-a111-4c2a-9d5c-4e4d97cc2c96

        name:
          type: string
          example: Скидка 10%

        status:
          $ref: '#/components/schemas/PartnerOfferStatus'

        activationDate:
          type: string
          format: date
          description: Дата начала действия оффера
          example: 2026-08-06

        expirationDate:
          type: string
          format: date
          description: Дата окончания действия оффера
          example: 2026-09-06

        availableCodes:
          type: integer
          minimum: 0
          description: Количество кодов, доступных в рамках оффера
          example: 320

        usedCodes:
          type: integer
          minimum: 0
          description: Количество использованных кодов оффера
          example: 210

        usagePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Процент использованных кодов оффера
          example: 66

    PartnerOfferStatus:
      type: string
      description: Текущий статус оффера
      enum:
        - ACTIVE
        - DRAFT
        - ARCHIVED
      example: ACTIVE

    PartnerOffersResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOfferListItemResponse'

    PartnerOfferListItemResponse:
      type: object
      required:
        - id
        - title
        - status
        - validFrom
        - validTo
        - availableCodes
        - totalCodes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/OfferStatus'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        availableCodes:
          type: integer
          format: int64
          minimum: 0
        totalCodes:
          type: integer
          format: int64
          minimum: 0

    OfferStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - EXPIRED

    SavePartnerRegistrationDraftBusinessInfoRequest:
      type: object
      required:
        - businessName
        - category
      properties:
        draftId:
          type: string
          format: uuid
          nullable: true
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        businessName:
          type: string
          minLength: 2
          maxLength: 100
          example: Sierra Coffee

        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Кофейня с завтраками, десертами и напитками

        category:
          $ref: '#/components/schemas/PartnerCategory'

    SavePartnerRegistrationDraftContactInfoRequest:
      type: object
      required:
        - contactName
        - contactPhone
      properties:
        draftId:
          type: string
          format: uuid
          nullable: true
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        contactName:
          type: string
          minLength: 2
          maxLength: 100
          example: Азамат

        contactPhone:
          type: string
          example: "+996700123456"

        contactEmail:
          type: string
          format: email
          maxLength: 255
          nullable: true
          example: azamat@mail.com

    PartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
      properties:
        draftId:
          type: string
          format: uuid
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

    PartnerCategory:
      type: string
      enum:
        - COFFEE_SHOP
        - RESTAURANT
        - FITNESS
        - BEAUTY
        - EDUCATION
        - HEALTH
        - ENTERTAINMENT
        - OTHER

    GetPartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
        - status
        - completedSteps
      properties:
        draftId:
          type: string
          format: uuid
          example: 7f4b6b3e-2d62-4d8e-b0d5-35f8c7c91a11

        status:
          type: string
          example: DRAFT

        completedSteps:
          type: array
          items:
            $ref: '#/components/schemas/PartnerRegistrationStep'
          example:
            - BUSINESS_INFO
            - CONTACTS

        businessInfo:
          $ref: '#/components/schemas/PartnerRegistrationDraftBusinessInfo'

        contacts:
          $ref: '#/components/schemas/PartnerRegistrationDraftContacts'

    PartnerRegistrationDraftBusinessInfo:
      type: object
      properties:
        businessName:
          type: string
          example: Sierra Coffee

        description:
          type: string
          nullable: true
          example: Кофейня в центре Бишкека

        category:
          $ref: '#/components/schemas/PartnerCategory'

    PartnerRegistrationDraftContacts:
      type: object
      properties:
        contactName:
          type: string
          example: Азамат

        contactPhone:
          type: string
          example: "+996700123456"

        contactEmail:
          type: string
          format: email
          nullable: true
          example: partner@example.kg

    PartnerRegistrationStep:
      type: string
      enum:
        - BUSINESS_INFO
        - CONTACTS
        
    SubmitPartnerRegistrationDraftResponse:
      type: object
      required:
        - draftId
        - status
        - partnerId
      properties:
        draftId:
          type: string
          format: uuid
          example: b7b7c3c1-2b15-4f7c-8c3d-1b4f02e8a111

        status:
          type: string
          example: SUBMITTED

        partnerId:
          type: string
          format: uuid
          example: 3d0a4c2a-9d5c-4e4d-97cc-2c96a5f6b123
